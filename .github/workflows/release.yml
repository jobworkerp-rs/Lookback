name: Release

# Maintained in the private gitea source and published to this repository by
# its release sync together with the rest of .github/; edit it there, not here.
# Triggered by the tag that the release sync forwards to this repository.
# Builds the signed macOS DMG, the Linux CUDA AppImage (with a `-cuda` suffix),
# and the Linux CPU bundles, and attaches them to the GitHub Release for the
# tag. The Linux bundles are built on the shared self-hosted GPU runner, which
# gets a read-only token and no secrets; a GitHub-hosted job publishes them.
# Every job is limited to GitHub so that the private source, which tracks this
# file, never runs it.
#
# A manual run (workflow_dispatch) rebuilds only the Linux jobs and publishes
# nothing, so a runner image change can be verified without cutting a release.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Only the jobs that publish raise this to write.
permissions:
  contents: read

# A re-pushed tag re-runs this; let a fresh run supersede an in-flight one
# without cancelling (avoid a half-uploaded release). A manual run uploads
# nothing, so a newer one cancels it instead of holding the runner for hours.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  # A manual run's ref is a branch, so leave the version in tauri.conf.json.
  LOOKBACK_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: fast guardrail checks. Release-gating integration tests run on the
  # gitea side before the tag is cut; this is a quick lint/unit pass.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & unit test
    if: github.server_url == 'https://github.com'
    runs-on: lookback-linux-cuda
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The self-hosted runner gives jobs no root access, so every system tool
      # the Linux jobs use comes from the runner image. Checking them here, on
      # the same runner, fails a release before any job uploads an artifact.
      # Keep the list in step with the preflight of scripts/build-release.sh.
      - name: Verify runner image tools
        run: |
          source scripts/lib/build-common.sh
          require_cmd protoc jq cmake pkg-config nvcc objdump \
            patchelf appimagetool desktop-file-validate xdg-open

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

      - name: Biome
        run: pnpm exec biome check src

      # tauri::generate_context! validates that frontendDist (../dist) exists at
      # compile time, so the frontend must be built before clippy/test. (The
      # build job gets this for free via tauri build's beforeBuildCommand.)
      - name: Build frontend (dist)
        run: pnpm build

      # tauri-build checks that externalBin/resources exist even for clippy/test
      # (which never run the binaries). This job doesn't run build-release.sh,
      # so stage empty placeholders to satisfy the existence check.
      - name: Stage CI placeholders
        run: |
          bash scripts/ci-stage-placeholders.sh
          # The tracked .gitkeep was removed; Tauri still requires the mapped
          # resource directory to exist while build.rs runs in this lint job.
          mkdir -p src-tauri/migration-bundle

      # build.rs runs tonic-prost-build, so protoc (installed above) is required
      # for clippy/test to compile the crate.
      - name: Clippy
        run: cargo clippy -p lookback-tauri --all-targets -- -D warnings

      # Unit/lib tests only: the tests/ integration suites can require the
      # sidecar binaries and a live DB which are absent here. --test-threads=1
      # because the keyring mock is installed process-wide.
      - name: Cargo test (unit/lib)
        run: cargo test -p lookback-tauri --lib --bins -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Stage 2: signed macOS release build (DMG).
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS DMG
    if: github.server_url == 'https://github.com' && github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, macOS, lookback-macos]
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install protobuf cmake pkgconf jq
          command -v protoc >/dev/null || { echo "protoc missing" >&2; exit 1; }
          command -v jq >/dev/null || { echo "jq missing" >&2; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-macos
          cache-on-failure: true
          workspaces: |
            .
            .build-deps/jobworkerp-rs
            .build-deps/memory-store
            .build-deps/jobworkerp-conductor
            .build-deps/llama-cpp-runner
            .build-deps/mm-embedding-runner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache lindera artifacts
        uses: actions/cache@v4
        with:
          path: .build-deps/.lindera-cache
          key: lindera-${{ runner.os }}-x86_64-v0.44.1

      - name: Clean stale Apple signing keychains
        run: |
          set -euo pipefail
          shopt -s nullglob
          for keychain in "${HOME}/Library/Keychains"/signing_temp*.keychain-db; do
            security delete-keychain "$keychain" || true
          done

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          keychain: signing_temp_${{ github.run_id }}_${{ github.run_attempt }}
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify Apple signing identity
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -F -- "${APPLE_SIGNING_IDENTITY}" >/dev/null \
            || { echo "APPLE_SIGNING_IDENTITY not found in keychain" >&2; exit 1; }
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Verify Apple notarization credentials
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json >/dev/null
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build signed macOS bundles
        run: bash scripts/build-release.sh --profile mac
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize macOS DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "no .dmg produced" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            if xcrun stapler validate "$dmg" >/dev/null 2>&1; then
              echo "notarization ticket already stapled: $dmg"
              continue
            fi
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify artifacts
        run: |
          set -euo pipefail
          out=target/release/bundle
          ls -la "$out/dmg" "$out/macos" || true
          shopt -s nullglob
          dmgs=("$out"/dmg/*.dmg)
          apps=("$out"/macos/*.app)
          [ ${#dmgs[@]} -gt 0 ] || { echo "no .dmg produced" >&2; exit 1; }
          [ ${#apps[@]} -gt 0 ] || { echo "no .app produced" >&2; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            find "$app/Contents/Resources/plugins" -name '*.dylib' \
              -exec codesign --verify --verbose=2 {} \;
            for binary in \
              "$app/Contents/Resources/memories-db-migrate/memories-db-migrate" \
              "$app/Contents/Resources/memories-db-migrate/atlas/bin/atlas"; do
              codesign --verify --strict --verbose=2 "$binary"
            done
            node scripts/verify-atlas-lock.mjs \
              "$app/Contents/Resources/memories-db-migrate/atlas" darwin-arm64
            node scripts/verify-migration-release.mjs \
              "$app/Contents/Resources/memories-db-migrate" \
              --require-provenance --atlas-platform darwin-arm64 \
              --app-assets "$GITHUB_WORKSPACE" \
              --distributed-assets "$app/Contents/Resources" \
              --front "$app/Contents/MacOS/front" \
              --import "$app/Contents/MacOS/memories-import"
          done
          for dmg in "${dmgs[@]}"; do
            codesign --verify --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
          done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Stage 3: Linux CUDA AppImage build on the self-hosted GPU runner.
  # ---------------------------------------------------------------------------
  build-cuda:
    name: Build Linux AppImage (cuda)
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: lookback-linux-cuda
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "-C relocation-model=pic"
      CFLAGS: "-fPIC"
      CXXFLAGS: "-fPIC"
      CMAKE_POSITION_INDEPENDENT_CODE: "ON"
      CUDA_COMPUTE_CAP: "89"
      # The self-hosted runner cannot mount FUSE, so AppImage tools
      # (linuxdeploy, appimagetool) must extract themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      LOOKBACK_TAURI_VERBOSE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: github-cuda
          cache-on-failure: true
          workspaces: |
            .
            .build-deps/jobworkerp-rs
            .build-deps/memory-store
            .build-deps/jobworkerp-conductor
            .build-deps/llama-cpp-runner
            .build-deps/mm-embedding-runner

      - name: Cache lindera artifacts
        uses: actions/cache@v4
        with:
          path: .build-deps/.lindera-cache
          key: lindera-linux-x86_64-v0.44.1

      - name: Pin CUDA compute capability
        if: vars.CUDA_COMPUTE_CAP != ''
        run: echo "CUDA_COMPUTE_CAP=${{ vars.CUDA_COMPUTE_CAP }}" >> "$GITHUB_ENV"

      - name: Build release AppImage (cuda)
        run: bash scripts/build-release.sh --profile linux-cuda --bundle appimage

      - name: Rename artifacts with -cuda suffix
        run: |
          set -euo pipefail
          out=target/release/bundle
          shopt -s nullglob
          for f in "$out"/appimage/*.AppImage; do
            mv "$f" "${f%.AppImage}-cuda.AppImage"
          done
          appimages=("$out"/appimage/*-cuda.AppImage)
          [ ${#appimages[@]} -gt 0 ] || { echo "no -cuda .AppImage produced" >&2; exit 1; }

      - name: Keep CUDA bundles for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: target/release/bundle/appimage/*-cuda.AppImage
          compression-level: 0
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Stage 4: Linux CPU release build after CUDA on the same self-hosted runner pool.
  # ---------------------------------------------------------------------------
  build:
    name: Build Linux bundles (cpu)
    if: github.server_url == 'https://github.com'
    needs: [test, build-cuda]
    runs-on: lookback-linux-cuda
    timeout-minutes: 120
    env:
      # The self-hosted runner cannot mount FUSE (see build-cuda).
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Cache this crate's target plus each dependency repo's target dir (cloned
      # by build-release.sh into .build-deps/<repo>). The dep repos track main,
      # so an upstream move busts only that repo's cache entry.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: true
          workspaces: |
            .
            .build-deps/jobworkerp-rs
            .build-deps/memory-store
            .build-deps/jobworkerp-conductor
            .build-deps/llama-cpp-runner
            .build-deps/mm-embedding-runner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The lindera CLI + IPADIC source CSV are downloaded each run; cache them.
      - name: Cache lindera artifacts
        uses: actions/cache@v4
        with:
          path: .build-deps/.lindera-cache
          key: lindera-${{ runner.os }}-x86_64-v0.44.1

      - name: Build release bundles (cpu)
        run: bash scripts/build-release.sh --platform linux --gpu cpu --bundle deb,appimage

      - name: Verify artifacts
        run: |
          set -euo pipefail
          out=target/release/bundle
          ls -la "$out/deb" "$out/appimage" || true
          shopt -s nullglob
          debs=("$out"/deb/*.deb)
          appimages=("$out"/appimage/*.AppImage)
          [ ${#debs[@]} -gt 0 ] || { echo "no .deb produced" >&2; exit 1; }
          [ ${#appimages[@]} -gt 0 ] || { echo "no .AppImage produced" >&2; exit 1; }

      - name: Keep CPU bundles for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          compression-level: 0
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Stage 5: attach the Linux bundles to the release from a GitHub-hosted runner,
  # so that a write token never reaches the shared self-hosted runner.
  # ---------------------------------------------------------------------------
  publish-linux:
    name: Publish Linux bundles
    if: github.server_url == 'https://github.com' && github.event_name == 'push'
    needs: [build-cuda, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # A hyphenated tag (v1.0.0-rc1 / -beta) is treated as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
