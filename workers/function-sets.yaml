# Function set definitions for the Lookback chat. `lookback-rag` preserves
# the retrieval-only RAG set; `lookback-chat` adds the chat-only Issue facade
# workers. Coding-agent proposal/status tools are shared with the external MCP set.
#
# Loaded by the sidecar startup path via
# `jobworkerp_client::client::function_set_yaml::register_function_sets_from_yaml`,
# layered AFTER the worker YAML so target name → WorkerId resolution
# can find `lookback_recall` (registered in workers/llm-workers.yaml).
#
# Kept in a separate file because the worker-YAML deserializer is
# `deny_unknown_fields` — `function_sets:` can't coexist with
# `workers:` in the same document.

defaults:
  category: 0

function_sets:
  - name: lookback-rag
    description: >-
      Tools for recalling the user's past Lookback memories. Use these
      whenever the question depends on prior conversations, decisions,
      or work history. `lookback_recall` searches BOTH the summary
      layer (per-thread / daily / weekly / monthly) and the raw-message
      layer in a single call.
    targets:
      - type: WORKER
        name: lookback_recall
        # The WORKFLOW runner exposes two methods (`run` / `create`). The
        # function-spec converter has a special-case for workflow workers
        # that defaults to `run` when `using` is unset, so this is
        # belt-and-suspenders; explicit is cheaper to read than relying
        # on that default for code we don't own.
        using: run
      - type: WORKER
        name: lookback_get_context
        using: run
      - type: WORKER
        name: lookback_get_reflections
        using: run

  - name: lookback-chat
    description: >-
      Tools for recalling saved Lookback memories and managing Issues from
      chat. Issue calls use the local trusted Issue Tracker and require a
      one-shot app-issued request permission. Mutations report success only
      after a durable COMMITTED operation is confirmed.
    targets:
      - type: WORKER
        name: lookback_recall
        using: run
      - type: WORKER
        name: lookback_get_context
        using: run
      - type: WORKER
        name: lookback_get_reflections
        using: run
      - type: WORKER
        name: lookback_issue_list
        using: unary
      - type: WORKER
        name: lookback_issue_get
        using: unary
      - type: WORKER
        name: lookback_issue_create
        using: unary
      - type: WORKER
        name: lookback_issue_update
        using: unary
      - type: WORKER
        name: lookback_issue_cancel
        using: unary
      - type: WORKER
        name: lookback_issue_agent_plan
        using: unary
      - type: WORKER
        name: lookback_issue_agent_get
        using: unary

  # MCP-exposed retrieval tools. Surfaced to EXTERNAL MCP clients
  # (e.g. Claude Desktop) when the user enables the MCP server in Settings —
  # the sidecar is then spawned with `MCP_SET_NAME=lookback-mcp`, which
  # narrows jobworkerp's MCP tool surface to exactly this set. Kept SEPARATE
  # from `lookback-rag` (the in-app chat tool set) so the MCP-visible surface
  # can grow independently of what the chat LLM may call. This is the
  # composite MCP boundary for RAG tools and curated Lookback Issue Gateway
  # workers. When the tracker is enabled but temporarily unavailable the
  # set stays stable and calls report the failure from the GRPC worker.
  # Disabling the tracker removes the Issue targets at registration time.
  - name: lookback-mcp
    description: >-
      Tools for searching the user's saved memories of their past work and
      conversations. Use these whenever the question depends on what the
      user did, decided, or discussed before. `lookback_recall` searches
      both the summaries (of single conversations and of each day, week, and
      month) and the original messages in a single call.
    targets:
      - type: WORKER
        name: lookback_recall
        using: run
      - type: WORKER
        name: lookback_get_context
        using: run
      - type: WORKER
        name: lookback_get_reflections
        using: run
      - type: WORKER
        name: lookback_issue_list_ready
        using: unary
      - type: WORKER
        name: lookback_issue_transition
        using: unary
      - type: WORKER
        name: lookback_issue_claim
        using: unary
      - type: WORKER
        name: lookback_issue_heartbeat
        using: unary
      - type: WORKER
        name: lookback_issue_release
        using: unary
      - type: WORKER
        name: lookback_issue_agent_plan
        using: unary
      - type: WORKER
        name: lookback_issue_agent_get
        using: unary
