document:
  dsl: "1.0.0-jobworkerp"
  namespace: memories
  name: monthly-work-summary-batch
  version: "1.0.0"

# Generates monthly-work-summary-single for a month range. Use this for
# back-fills or manual re-runs over multiple months. Cron-style monthly
# execution should call monthly-work-summary-single directly with no
# `target_month` (defaults to "last completed month").

input:
  schema:
    document:
      type: object
      properties:
        user_id: { type: integer }
        memories_grpc_host: { type: string, default: "localhost" }
        memories_grpc_port: { type: integer, default: 9100 }
        memories_grpc_tls: { type: boolean, default: false }
        llm_worker_name:
          type: string
          default: "memories-llm"
          description: >-
            Named worker for LLM completion, forwarded to each monthly
            single invocation. Defaults to `memories-llm`.
        output_language:
          type: string
          enum: ["ja", "en"]
          default: "ja"
          description: >-
            Output language for generated free-text. Selects the
            language-specific single worker
            (`memories-monthly-work-summary-single-<lang>`) per fan-out.
        start_month:
          type: string
          default: ""
          description: >-
            Month token "YYYY-MM" or empty. Empty = use last_n_months
            (or fall back to "last completed month only"). When
            non-empty, end_month must also be set; (start, end) wins
            over last_n_months.
        end_month:
          type: string
          default: ""
          description: Inclusive end month ("YYYY-MM") or empty.
        target_months:
          type: array
          items: { type: string }
          default: []
          description: Explicit YYYY-MM periods. When non-empty, this exact sorted set takes precedence over range and last-N modes.
        last_n_months:
          type: integer
          default: 0
          description: >-
            Last N months ending the previous fully-completed month
            (in tz). 0 = unused (falls back to start/end or "last
            month only").
        timezone_offset_hours: { type: integer, minimum: 0, maximum: 23, default: 9 }
        weekly_label: { type: string, default: "weekly_summary" }
        monthly_label: { type: string, default: "monthly_summary" }
        extra_labels_filter:
          type: array
          items: { type: string }
          default: []
        extra_labels_match_mode:
          type: string
          enum: ["LABEL_ALL", "LABEL_ANY"]
          default: "LABEL_ALL"
        min_thread_count: { type: integer, default: 1 }
        max_context_chars: { type: integer, default: 200000 }
        summary_output_guidance: { type: object, default: {monthly: {item_chars: 800, total_chars: 80000}, max_purpose_groups: {monthly: 50}, max_source_memory_ids: 10} }
        llm_context_window_tokens: { type: integer, minimum: 1024, default: 131072 }
        llm_expected_model: { type: string, default: "" }
        summary_max_completion_tokens: { type: integer, minimum: 1, default: 32768 }
        summary_input_byte_budget: { type: integer, minimum: 0, default: 200000 }
        force_resummarize: { type: boolean, default: false }
        stop_on_error: { type: boolean, default: false }
        # SHA-256 of canonical {"labels":[],"match_mode":"LABEL_ALL","version":1}.
        source_scope_digest: { type: string, default: "999b928053067e9fc9369c99aa2ef91b5d096fabee5c34e90097fa937820524a" }
        generation_id: { type: string, default: "" }
        generation_started_at: { type: string, default: "" }

do:
  # Step 1: Resolve the month list. Modes (in priority order):
  #   range:       (start_month, end_month) inclusive
  #   last-N:      last_n_months ending the previous completed month
  #   fallback:    [last_month] only
  #
  # Month math runs in "year * 12 + month_index" ordinal space to
  # avoid DST/leap traps. See monthly-work-summary-single.yaml for
  # the strftime/mktime UTC-as-if rationale.
  # `last_month_token` anchor: offset path shifts `now` by the fixed
  # offset; TZ path renders this month's local 1st via strflocaltime,
  # converts to a DST-aware UTC epoch with candidate offset re-evaluation,
  # backs up one second into last month, and reformats.
  - resolveLastMonthToken:
      set:
        last_month_token: >-
          ${ if (env.TZ // "") != ""
             then (((now | strflocaltime("%Y-%m-01T00:00:00"))
                   | strptime("%Y-%m-%dT%H:%M:%S") | mktime) as $wall_epoch
                   | ($wall_epoch | localtime | mktime) as $first_local_epoch
                   | ($wall_epoch - ($first_local_epoch - $wall_epoch)) as $candidate_epoch
                   | ($wall_epoch | strftime("%Y-%m-%d")) as $target_day
                   | if ($candidate_epoch | strflocaltime("%Y-%m-%d")) == $target_day
                     then (($candidate_epoch - 1) | strflocaltime("%Y-%m"))
                     else (($candidate_epoch | localtime | mktime) as $candidate_local_epoch
                           | (($wall_epoch - ($candidate_local_epoch - $candidate_epoch)) - 1
                              | strflocaltime("%Y-%m")))
                     end)
             else (((((now + ($workflow.input.timezone_offset_hours * 3600))
                      | strftime("%Y-%m-01T00:00:00Z"))
                     | strptime("%Y-%m-%dT%H:%M:%SZ")
                     | mktime) - 1)
                   | strftime("%Y-%m"))
             end }

  - resolveMonthRange:
      set:
        # Month math runs in "year * 12 + (month - 1)" ordinal space
        # to avoid leap-year / DST traps. `as $p | ...` binds the
        # split() result before array indexing because jaq's pipe
        # precedence inside [...] mishandles `split("-") | [.[0]|...,
        # .[1]|...]` directly.
        month_list: >-
          ${ if ($workflow.input.target_months // [] | length) > 0
             then ($workflow.input.target_months | unique | sort)
             elif $workflow.input.start_month != ""
                and $workflow.input.end_month != ""
             then
               (($workflow.input.start_month | split("-")) as $sp
                | (($sp[0] | tonumber) * 12 + (($sp[1] | tonumber) - 1)) as $s
                | ($workflow.input.end_month | split("-")) as $ep
                | (($ep[0] | tonumber) * 12 + (($ep[1] | tonumber) - 1)) as $e
                | [range($s; $e + 1)]
                | map(((. / 12) | floor) as $y
                      | (. - $y * 12 + 1) as $m
                      | ($y | tostring) + "-"
                        + ($m | tostring
                           | if length == 1 then "0" + . else . end)))
             elif $workflow.input.last_n_months > 0
             then
               (($last_month_token | split("-")) as $lp
                | (($lp[0] | tonumber) * 12 + (($lp[1] | tonumber) - 1)) as $base
                | [range(0; $workflow.input.last_n_months)]
                | map(($base - .) as $idx
                      | (($idx / 12) | floor) as $y
                      | ($idx - $y * 12 + 1) as $m
                      | ($y | tostring) + "-"
                        + ($m | tostring
                           | if length == 1 then "0" + . else . end))
                | reverse)
             else
               [$last_month_token]
             end }

  # Step 1.5: Initialize accumulators so the for-loop below can append
  # to them and the output block can reference them even when zero
  # iterations ran.
  - initOutcomeAccumulators:
      set:
        generated_months: "${ [] }"
        skipped_months: "${ [] }"
        failed_months: "${ [] }"
        failed_path_buckets: "${ [] }"
        last_error: "${ null }"

  # Step 2: For each month, dispatch monthly-work-summary-single.
  # Failures in one month must not abort the rest of the range.
  - summarizeEachMonth:
      for:
        each: target_month
        at: month_index
        in: "${ $month_list }"
      onError: continue
      do:
        - reportProgress:
            set:
              progress_processed: "${ $month_index + 1 }"
              progress_total: "${ $month_list | length }"
        - abortBeforeNextMonthAfterPathFailure:
            if: "${ $workflow.input.stop_on_error and ($failed_path_buckets | length) > 0 }"
            raise:
              error:
                type: "https://memories.local/errors/monthly-work-summary/path"
                status: 500
                title: "monthly path summary failed"
                detail: "stop_on_error is enabled; no later period was started"
        - initPathOutcome:
            set:
              path_failed_for_month: "${ false }"
              planned_monthly_path_bucket_digests: "${ [] }"
        - discoverPathPlan:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            try:
              - runPathPlan:
                  run:
                    function:
                      workerName: '${ "memories-monthly-work-summary-single-" + $workflow.input.output_language }'
                      arguments:
                        input: >-
                          ${ {user_id:$workflow.input.user_id,target_month:$target_month,
                              timezone_offset_hours:$workflow.input.timezone_offset_hours,
                              memories_grpc_host:$workflow.input.memories_grpc_host,
                              memories_grpc_port:$workflow.input.memories_grpc_port,
                              memories_grpc_tls:$workflow.input.memories_grpc_tls,
                              weekly_label:$workflow.input.weekly_label,monthly_label:$workflow.input.monthly_label,
                              source_memory_kind:"MEMORY_KIND_WEEKLY_SUMMARY",
                              source_thread_labels_override:[$workflow.input.weekly_label,"summary_scope:path","source_scope:"+$workflow.input.source_scope_digest],
                              source_thread_match_mode:"LABEL_ALL",plan_only:true}|tojson }
                  export:
                    as:
                      monthly_path_plan: "${ .output | fromjson }"
            catch:
              as: error
              do:
                - recordPathPlanFailure:
                    set:
                      failed_months: "${ $failed_months + [$target_month] }"
                      last_error: "${ $error }"
                - abortImmediatelyAfterPathPlanFailure:
                    if: "${ $workflow.input.stop_on_error }"
                    raise:
                      error:
                        type: "https://memories.local/errors/monthly-work-summary/path-plan"
                        status: 500
                        title: "monthly path plan failed before summary generation"
                        detail: "stop_on_error is enabled; remaining paths were not started"
        - derivePlannedPathBucketDigests:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            for:
              each: planned_path_bucket
              in: "${ $monthly_path_plan.path_buckets // [] }"
            do:
              - derivePlannedPathBucketDigest:
                  run:
                    function:
                      runnerName: COMMAND
                      settings: {}
                      arguments:
                        command: "/bin/sh"
                        args: ["-c", "if command -v shasum >/dev/null 2>&1; then shasum -a 256; else sha256sum; fi | awk '{print $1}'"]
                        stdin: >-
                          ${ if $planned_path_bucket.path_bucket_kind == "label"
                             then ({kind: "label", label: $planned_path_bucket.path_label, version: 1} | tojson)
                             else ({kind: $planned_path_bucket.path_bucket_kind, version: 1} | tojson)
                             end }
                        treat_nonzero_as_error: true
                  export:
                    as:
                      planned_path_bucket_digest: "${ .stdout | split(\" \")[0] }"
              - recordPlannedPathBucketDigest:
                  set:
                    planned_monthly_path_bucket_digests: "${ $planned_monthly_path_bucket_digests + [$planned_path_bucket_digest] }"
        # See the daily/weekly batches: delete only stale v2 derived Memory
        # rows, leaving legacy data and orphan threads available to users.
        - findExistingPathThreads:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            run:
              function:
                runnerName: GRPC
                using: streaming
                settings:
                  host: "${$workflow.input.memories_grpc_host}"
                  port: ${$workflow.input.memories_grpc_port}
                  tls: ${$workflow.input.memories_grpc_tls}
                  useReflection: true
                arguments:
                  method: "/llm_memory.service.ThreadService/FindThreadListByLabels"
                  json_body: >-
                    ${ {labels: [$workflow.input.monthly_label, "month:" + $target_month,
                                  "summary_scope:path", "source_scope:" + $workflow.input.source_scope_digest],
                        match_mode: "LABEL_ALL", user_id: $workflow.input.user_id,
                        memory_kinds: ["MEMORY_KIND_MONTHLY_SUMMARY"]} | tojson }
                  as_json: true
            export:
              as:
                existing_monthly_path_threads: "${ .jsonBody | fromjson }"
        - identifyStalePathThreads:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            set:
              stale_monthly_path_threads: >-
                ${ ($monthly_path_plan.path_buckets // []
                    | map(if .path_bucket_kind == "label" then "label:" + .path_label
                          else .path_bucket_kind + ":" end)) as $planned
                   | $existing_monthly_path_threads
                   | map(select((.data.labels // []) as $labels
                                | ($labels | map(select(startswith("path:"))) | unique) as $paths
                                | (if ($labels | index("summary_path:ambiguous")) != null then "ambiguous:"
                                   elif ($labels | index("summary_path:unassigned")) != null then "unassigned:"
                                   elif ($paths | length) == 1 then "label:" + $paths[0]
                                   else "ambiguous:" end) as $bucket_key
                                | ($planned | index($bucket_key)) == null)) }
        - cleanupStalePathMemories:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            for:
              each: stale_thread
              in: "${ $stale_monthly_path_threads }"
            onError: continue
            do:
              - findStaleMemories:
                  run:
                    function:
                      runnerName: GRPC
                      using: streaming
                      settings:
                        host: "${$workflow.input.memories_grpc_host}"
                        port: ${$workflow.input.memories_grpc_port}
                        tls: ${$workflow.input.memories_grpc_tls}
                        useReflection: true
                      arguments:
                        method: "/llm_memory.service.ThreadService/FindMemoriesByThreadId"
                        json_body: >-
                          ${ {thread_id: {value: $stale_thread.id.value},
                              roles: ["ROLE_ASSISTANT"], content_types: ["TEXT"]} | tojson }
                        as_json: true
                  export:
                    as:
                      stale_monthly_path_memories: >-
                        ${ (.jsonBody // "[]") | fromjson
                           | map(select((.data.externalId // "") | startswith("monthly:v2:"))) }
              - deleteStaleMemories:
                  for:
                    each: stale_memory
                    in: "${ $stale_monthly_path_memories }"
                  do:
                    - deleteStaleMemory:
                        run:
                          function:
                            runnerName: GRPC
                            using: unary
                            settings:
                              host: "${$workflow.input.memories_grpc_host}"
                              port: ${$workflow.input.memories_grpc_port}
                              tls: ${$workflow.input.memories_grpc_tls}
                              useReflection: true
                            arguments:
                              method: "/llm_memory.service.MemoryService/Delete"
                              json_body: "${ $stale_memory.id | tojson }"
                              as_json: true
        - summarizeEachPath:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            for:
              each: path_bucket
              in: "${ $monthly_path_plan.path_buckets // [] }"
            do:
              - derivePathBucketDigest:
                  run:
                    function:
                      runnerName: COMMAND
                      settings: {}
                      arguments:
                        command: "/bin/sh"
                        args: ["-c", "if command -v shasum >/dev/null 2>&1; then shasum -a 256; else sha256sum; fi | awk '{print $1}'"]
                        stdin: >-
                          ${ if $path_bucket.path_bucket_kind == "label"
                             then ({kind: "label", label: $path_bucket.path_label, version: 1} | tojson)
                             else ({kind: $path_bucket.path_bucket_kind, version: 1} | tojson)
                             end }
                        treat_nonzero_as_error: true
                  export:
                    as:
                      path_bucket_digest: "${ .stdout | split(\" \")[0] }"
              - invokePathSingle:
                  try:
                    - runPathSingle:
                        run:
                          function:
                            workerName: '${ "memories-monthly-work-summary-single-" + $workflow.input.output_language }'
                            arguments:
                              input: >-
                                ${ {user_id:$workflow.input.user_id,target_month:$target_month,
                                  timezone_offset_hours:$workflow.input.timezone_offset_hours,
                                  memories_grpc_host:$workflow.input.memories_grpc_host,
                                  memories_grpc_port:$workflow.input.memories_grpc_port,
                                  memories_grpc_tls:$workflow.input.memories_grpc_tls,
                                  llm_worker_name:$workflow.input.llm_worker_name,output_language:$workflow.input.output_language,
                                  weekly_label:$workflow.input.weekly_label,monthly_label:$workflow.input.monthly_label,
                                  v2_source_scope_digest:$workflow.input.source_scope_digest,v2_rollup_scope:"path",
                                  v2_path_bucket_digest:$path_bucket_digest,
                                  v2_path_bucket_kind:$path_bucket.path_bucket_kind,v2_path_label:$path_bucket.path_label,
                                  generation_id:$workflow.input.generation_id,generation_started_at:$workflow.input.generation_started_at,
                                  summary_output_guidance:$workflow.input.summary_output_guidance,
                                  llm_context_window_tokens:$workflow.input.llm_context_window_tokens,llm_expected_model:$workflow.input.llm_expected_model,
                                  summary_max_completion_tokens:$workflow.input.summary_max_completion_tokens,
                                  summary_input_byte_budget:$workflow.input.summary_input_byte_budget,
                                  planned_source_memory_ids:$path_bucket.source_memory_ids,
                                  source_memory_kind:"MEMORY_KIND_WEEKLY_SUMMARY",
                                  source_thread_labels_override:[$workflow.input.weekly_label,"summary_scope:path","source_scope:"+$workflow.input.source_scope_digest],
                                  source_thread_match_mode:"LABEL_ALL"}|tojson }
                        export:
                          as:
                            path_single_result: "${ .output | fromjson }"
                    - rejectEmptyPlannedPathResult:
                        if: >-
                          ${ ($path_single_result.skipped // false)
                             and (($path_single_result.source_memory_count // 0) == 0) }
                        raise:
                          error:
                            type: "https://memories.local/errors/monthly-work-summary/path-source-disappeared"
                            status: 409
                            title: "monthly path source memories disappeared after planning"
                            detail: "the planned Path bucket no longer has source memories"
                  catch:
                    as: error
                    do:
                      - recordPathFailure:
                          set:
                            path_failed_for_month: "${ true }"
                            failed_path_buckets: >-
                              ${ $failed_path_buckets + [{period_key:$target_month,
                                  path_bucket_digest:$path_bucket_digest,
                                  path_bucket_kind:$path_bucket.path_bucket_kind,
                                  path_label:$path_bucket.path_label,error:$error}] }
                      - abortImmediatelyAfterPathFailure:
                          if: "${ $workflow.input.stop_on_error }"
                          raise:
                            error:
                              type: "https://memories.local/errors/monthly-work-summary/path"
                              status: 500
                              title: "monthly path summary failed"
                              detail: "stop_on_error is enabled; remaining paths were not started"

        - abortBeforeOverallOnPathFailure:
            if: "${ $workflow.input.stop_on_error and $path_failed_for_month }"
            raise:
              error:
                type: "https://memories.local/errors/monthly-work-summary/path"
                status: 500
                title: "monthly path summary failed"
                detail: "stop_on_error is enabled; overall generation was not attempted"
        - invokeSingleWithRetry:
            if: "${ (($failed_months | index($target_month)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0))) | not) }"
            try:
              - invokeSingle:
                  run:
                    function:
                      # Resolve the language-specific single worker by name.
                      # Its registered channel (llm_workflow, concurrency=1)
                      # keeps the LLM-containing single workflows off the
                      # `llm` slot the inner LLM job needs (no deadlock).
                      workerName: '${ "memories-monthly-work-summary-single-" + $workflow.input.output_language }'
                      arguments:
                        input: >-
                          ${ {
                            user_id: $workflow.input.user_id,
                            target_month: $target_month,
                            timezone_offset_hours: $workflow.input.timezone_offset_hours,
                            memories_grpc_host: $workflow.input.memories_grpc_host,
                            memories_grpc_port: $workflow.input.memories_grpc_port,
                            memories_grpc_tls: $workflow.input.memories_grpc_tls,
                            llm_worker_name: $workflow.input.llm_worker_name,
                            output_language: $workflow.input.output_language,
                            weekly_label: $workflow.input.weekly_label,
                            monthly_label: $workflow.input.monthly_label,
                            extra_labels_filter: $workflow.input.extra_labels_filter,
                            extra_labels_match_mode: ($workflow.input.extra_labels_match_mode // "LABEL_ALL"),
                            min_thread_count: $workflow.input.min_thread_count,
                            max_context_chars: $workflow.input.max_context_chars,
                            summary_output_guidance: $workflow.input.summary_output_guidance,
                            llm_context_window_tokens: $workflow.input.llm_context_window_tokens,
                            llm_expected_model: $workflow.input.llm_expected_model,
                            summary_max_completion_tokens: $workflow.input.summary_max_completion_tokens,
                            summary_input_byte_budget: $workflow.input.summary_input_byte_budget,
                            force_resummarize: $workflow.input.force_resummarize,
                            v2_source_scope_digest: $workflow.input.source_scope_digest,
                            v2_rollup_scope: "overall",
                            source_memory_kind: "MEMORY_KIND_MONTHLY_SUMMARY",
                            source_thread_labels_override: [$workflow.input.monthly_label,
                                                            "month:" + $target_month,
                                                            "summary_scope:path",
                                                            "source_scope:" + $workflow.input.source_scope_digest],
                            source_thread_match_mode: "LABEL_ALL",
                            expected_path_bucket_count: ($monthly_path_plan.path_buckets | length),
                            planned_path_bucket_digests: $planned_monthly_path_bucket_digests,
                            v2_failed_path_buckets: ($failed_path_buckets | map(select(.period_key == $target_month))),
                            generation_id: $workflow.input.generation_id,
                            generation_started_at: $workflow.input.generation_started_at
                          } | tojson }
                  export:
                    as:
                      single_result: "${ .output | fromjson }"
              - rejectLogicalFailure:
                  if: >-
                    ${ (($single_result.completed // false)
                        or ($single_result.skipped // false)) | not }
                  raise:
                    error:
                      type: "https://memories.local/errors/monthly-work-summary/incomplete"
                      status: 500
                      title: "monthly summary returned neither completed nor skipped"
              - recordGenerated:
                  if: >-
                    ${ ($single_result.completed // false)
                       and (($single_result.skipped // false) | not) }
                  set:
                    generated_months: "${ $generated_months + [$target_month] }"
              - recordSkipped:
                  if: "${ $single_result.skipped // false }"
                  set:
                    skipped_months: "${ $skipped_months + [$target_month] }"
            catch:
              as: error
              do:
                - recordFailure:
                    set:
                      failed_months: "${ $failed_months + [$target_month] }"
                      last_error: "${ $error }"

  # An item whose own try timed out is skipped by `onError: continue` without
  # reaching its catch. Count such items as failed so an incomplete run is
  # never reported as completed.
  - collectUnaccountedMonths:
      set:
        unaccounted_months: >-
          ${ ($month_list) - $generated_months - $skipped_months - $failed_months }
  - recordUnaccountedMonths:
      if: "${ ($unaccounted_months | length) > 0 }"
      set:
        failed_months: "${ $failed_months + $unaccounted_months }"
        last_error: >-
          ${ $last_error // ((($unaccounted_months | length) | tostring)
             + " item(s) ended without an outcome (timed out or aborted)") }

  - abortBatchOnPathFailure:
      if: "${ $workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_months | length) > 0)) }"
      raise:
        error:
          type: "https://memories.local/errors/monthly-work-summary/path"
          status: 500
          title: "monthly path summary failed"
          detail: "one or more path summaries failed"

output:
  as:
    completed: ${ ($failed_months | length) == 0 }
    outcome: >-
      ${ if ($failed_months | length) > 0 then "failed"
         elif ($failed_path_buckets | length) > 0 then "completed_with_errors"
         else "succeeded" end }
    processed_months: ${ $month_list | length }
    generated_count: ${ $generated_months | length }
    skipped_count: ${ $skipped_months | length }
    succeeded_count: >-
      ${ ($generated_months | length) + ($skipped_months | length) }
    failed_count: ${ $failed_months | length }
    months: ${ $month_list }
    generated_months: ${ $generated_months }
    skipped_months: ${ $skipped_months }
    succeeded_months: ${ $generated_months + $skipped_months }
    failed_months: ${ $failed_months }
    last_error: ${ $last_error }
    failed_path_buckets: ${ $failed_path_buckets }
