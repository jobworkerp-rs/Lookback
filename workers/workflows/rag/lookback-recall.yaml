document:
  dsl: "1.0.0-jobworkerp"
  namespace: lookback
  name: lookback-recall
  version: "1.0.0"
  summary: >
    Search the user's past memories. A single call returns matches from
    both the summary layer (thread-group overviews and each day, week, and
    month) and the raw-message layer (the original
    messages), and each result is tagged with its kind so you can tell a
    high-level overview from a specific detail. Use the summary results to
    locate the right conversation or period, and the raw-message results
    when you need exact wording. Call this for any question about the
    user's prior conversations, decisions, or work history.

input:
  schema:
    document:
      type: object
      properties:
        query:
          type: string
          description: >-
            Natural-language search query, written in the same language as
            the user's question. Matched against the stored memories by both
            keyword and meaning, so a plain description of what you are
            looking for works well.
        limit_per_layer:
          type: integer
          default: 5
          description: >-
            Maximum number of results to return from each layer. Thread-group,
            v2-period, legacy-period, and raw-message layers are searched
            independently, so a single call can return up to four times this
            number of results. Increase it when you need broader coverage.
        summary_labels:
          type: array
          items: { type: string }
          description: >-
            Optional filter that restricts the summary layer to summaries of
            a specific kind or time period. Use it when the question targets
            a particular kind or period rather than a general topic.
            Labels are exact stored labels. Available kind labels are
             "thread_group_summary",
             "daily_summary",
            "weekly_summary", and "monthly_summary". Period labels are
            "date:YYYY-MM-DD", "iso_week:YYYY-Www", and "month:YYYY-MM".
            V2 period summaries also accept "summary_scope:overall" and
            "summary_scope:path". A path summary accepts its complete stored
            "path:<value>" label (never the abbreviated UI name), or the
            reserved "summary_path:unassigned" / "summary_path:ambiguous".
            Examples: a daily overall uses ["daily_summary",
            "date:2026-09-03","summary_scope:overall"]; a monthly path
            uses ["monthly_summary","month:2026-09","summary_scope:path",
            "path:/workspace/example"]. Omit to use the configured default.
        summary_label_match:
          type: string
          enum: ["ANY", "ALL"]
          default: "ALL"
          description: >-
            How the labels in `summary_labels` are combined. "ALL" (default)
            requires every label to match — use it to pin both a kind and a
            period at once, e.g. the daily summary for a specific day:
            summary_labels=["daily_summary","date:2026-05-29"],
            summary_label_match="ALL". "ANY" matches a summary that carries
            at least one of the labels, for broader lookups. Use ALL when
            combining kind, period, scope, and path axes. A flat ANY cannot
            express "one of several kinds AND one path"; make one call per
            kind in that case. Ignored when `summary_labels` is omitted.
        # MCP uses this default when the caller does not provide a scope
        # label. The in-app chat path always injects overall_only, so this
        # MCP setting never broadens chat recall.
        mcp_default_period_scope:
          type: string
          enum: ["overall_only", "overall_and_path"]
          default: "%{LOOKBACK_MCP_RAG_DEFAULT_PERIOD_SCOPE:-overall_only}"
          x-hidden: true
        # The memories gRPC endpoint HybridSearch dials. Two callers, two
        # ways the value arrives:
        #   1. Chat (Tauri-mediated): the `chat_ask` command rewrites the
        #      tool schema down to {query, limit_per_layer} and INJECTS
        #      `memories_grpc_*` per-dispatch from the active connection
        #      (chat.rs::lookback_recall_dispatch_args). The injected value
        #      wins over the defaults below.
        #   2. MCP (external client, e.g. Claude Desktop): jobworkerp runs
        #      the workflow DIRECTLY with no Tauri in the loop, so there is
        #      no per-dispatch injection — the client never sends
        #      `memories_grpc_*`. The defaults below are therefore the only
        #      endpoint the MCP path gets, so they are `%{...}` placeholders
        #      that `start_inner` resolves from the SAME active connection
        #      (resolve_targets().memories_callback()) into the Tauri process
        #      env before registering this worker. In remote mode that points
        #      MCP search at the configured remote memories (incl. HTTPS),
        #      matching the chat / browse target. Quote-less for port / tls so
        #      `expand_env` substitutes a raw integer / boolean (a quoted
        #      scalar would fail proto-JSON type coercion — see
        #      `llm-workers.yaml`'s `reuse_kv_prefix` note).
        # NOT in `required`: the MCP client cannot supply them, so requiring
        # them would reject every MCP call at schema validation; the resolved
        # defaults stand in instead.
        #
        # `port` / `tls` are UNQUOTED `%{...}` so that after `expand_env`
        # (which jobworkerp's loader runs as a text substitution BEFORE YAML
        # parsing) they become a NATIVE integer / boolean literal — NOT a
        # quoted string. This is load-bearing: jobworkerp's
        # `apply_schema_defaults` copies an input `default` VERBATIM with no
        # type coercion (it does not consult `type`), and the value flows
        # through the jq `${...}` references below as-is. A quoted `"9010"` /
        # `"false"` default would therefore reach the GRPC runner's
        # `settings.port` (int) / `settings.tls` (bool) as a string and fail
        # — the chat path never hits this because Tauri injects native
        # numbers/booleans per-dispatch, so only the MCP default path would
        # break. `host` stays quoted (it's a string field). The committed file
        # is not valid YAML until expanded (a bare `%{...}` token); the
        # `workflow_yamls_parse` unit test expands `%{VAR:-default}` to its
        # default before parsing, mirroring the loader.
        memories_grpc_host:
          { type: string, default: "%{LOOKBACK_RAG_MEMORIES_HOST:-127.0.0.1}" }
        memories_grpc_port: { type: integer, default: %{LOOKBACK_RAG_MEMORIES_PORT:-9010} }
        memories_grpc_tls: { type: boolean, default: %{LOOKBACK_RAG_MEMORIES_TLS:-false} }
      required: [query]

do:
  # Step 1: Embed the query once. HybridSearch is "client-side embedded"
  # — the server fuses our vector hits with its own BM25 pass over
  # `query_text`, so we MUST supply a vector. We reuse the same
  # multimodal embedding worker that memory rows were embedded with so
  # cosine similarity is in-space.
  #
  # Resolve the mm-embedding worker in the same space as memories' stored
  # vectors. Calling it through `worker.name` keeps the call on jobworkerp —
  # the memories gRPC frontend does NOT expose
  # `/jobworkerp.runner.MultimodalEmbeddingRunner`.
  - embedQuery:
      run:
        worker:
          # The app resolves this from Memories' GetEmbeddingSpace response
          # after Memories starts; do not fall back to a legacy worker name.
          name: "%{LOOKBACK_MM_EMBEDDING_WORKER}"
          using: embed_text
          arguments:
            text: "${ $workflow.input.query }"
            prefix: "%{MEMORY_EMBEDDING_QUERY_PREFIX:-}"
      export:
        as:
          # `embed_text` returns { embeddings: [{ values: [...] }, ...] }.
          # Hybrid search expects exactly one vector; take the first chunk.
          # An empty `values` here means the query was below
          # `min_chunk_tokens` — let HybridSearch fail naturally so the
          # caller (chat) sees a real error rather than a silent zero-hit.
          query_vector: "${ (.embeddings // [{}])[0].values // [] }"

  # Step 2: Search thread-group summaries separately from period summaries.
  # Period scope labels do not exist on group rows; keeping the queries
  # separate avoids the broken flat condition `(group OR daily) AND scope`.
  - searchThreadGroupSummaries:
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.MemoryVectorService/HybridSearch"
            json_body: >-
              ${ ($workflow.input.summary_labels // []) as $req_labels
               | (($req_labels | length) > 0) as $has
               | (if $has and ($workflow.input.summary_label_match // "ALL") == "ANY"
                  then "LABEL_ANY" else "LABEL_ALL" end) as $match
               | {
                  query_vectors: [ { values: $query_vector } ],
                  query_text: $workflow.input.query,
                  options: {
                    limit: ($workflow.input.limit_per_layer // 5),
                    filter: (
                      {
                        user_id: "1",
                        memory_kinds: ["MEMORY_KIND_DERIVED_SUMMARY"],
                        externalIdPrefix: "thread-group-summary:"
                      }
                      + (if $has then {
                           thread_filter: {
                             user_id: "1",
                             labels: $req_labels,
                             label_match_mode: $match
                           }
                         } else {} end)
                    )
                  }
                } | tojson }
            as_json: true
      export:
        as:
          thread_group_summary_hits: ${ (.jsonBody // "[]") | fromjson }

  - searchPeriodSummaries:
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.MemoryVectorService/HybridSearch"
            json_body: >-
              ${ ($workflow.input.summary_labels // []) as $req_labels
               | (($req_labels | length) > 0) as $has
               | ($req_labels
                  | any(. == "summary_scope:overall" or . == "summary_scope:path")) as $has_scope
               | (if $has
                  then (if $has_scope
                           or ($workflow.input.summary_label_match // "ALL") == "ANY"
                           or $workflow.input.mcp_default_period_scope == "overall_and_path"
                        then $req_labels
                        else $req_labels + ["summary_scope:overall"] end)
                  elif $workflow.input.mcp_default_period_scope == "overall_only"
                  then ["summary_scope:overall"]
                  else [] end) as $labels
               | (($labels | length) > 0) as $has_labels
               | (if $has and ($workflow.input.summary_label_match // "ALL") == "ANY"
                  then "LABEL_ANY" else "LABEL_ALL" end) as $match
               | {
                  query_vectors: [ { values: $query_vector } ],
                  query_text: $workflow.input.query,
                  options: {
                    limit: ($workflow.input.limit_per_layer // 5),
                    filter: (
                      {
                        user_id: "1",
                        memory_kinds: ["MEMORY_KIND_DAILY_SUMMARY", "MEMORY_KIND_WEEKLY_SUMMARY", "MEMORY_KIND_MONTHLY_SUMMARY"]
                      }
                      + (if $has_labels then {
                           thread_filter: {
                             user_id: "1",
                             labels: $labels,
                             label_match_mode: $match
                           }
                         } else {} end)
                    )
                  }
                } | tojson }
            as_json: true
      export:
        as:
          period_summary_hits: ${ (.jsonBody // "[]") | fromjson }

  # `summary_scope:*` did not exist before the path-scoped rollup model.
  # HybridSearch has no "label is absent" predicate, so query the historical
  # period rows separately and discard known v2 external-ID shapes locally.
  # This preserves old daily/weekly/monthly recall without letting a v2 path
  # rollup leak through the default `overall_only` query above.
  - searchLegacyPeriodSummaries:
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.MemoryVectorService/HybridSearch"
            json_body: >-
              ${ ($workflow.input.summary_labels // []) as $req_labels
               | (($req_labels | length) > 0) as $has
               | (if $has and ($workflow.input.summary_label_match // "ALL") == "ANY"
                  then "LABEL_ANY" else "LABEL_ALL" end) as $match
               | {
                  query_vectors: [ { values: $query_vector } ],
                  query_text: $workflow.input.query,
                  options: {
                    limit: ($workflow.input.limit_per_layer // 5),
                    filter: (
                      {
                        user_id: "1",
                        memory_kinds: ["MEMORY_KIND_DAILY_SUMMARY", "MEMORY_KIND_WEEKLY_SUMMARY", "MEMORY_KIND_MONTHLY_SUMMARY"]
                      }
                      + (if $has then {
                           thread_filter: {
                             user_id: "1",
                             labels: $req_labels,
                             label_match_mode: $match
                           }
                         } else {} end)
                    )
                  }
                } | tojson }
            as_json: true
      export:
        as:
          legacy_period_summary_hits: >-
            ${ (.jsonBody // "[]") | fromjson
               | map(select((.memory.data.externalId // "")
                            | (startswith("daily:v2:")
                               or startswith("weekly:v2:")
                               or startswith("monthly:v2:"))
                             | not)) }

  - combineSummaryHits:
      set:
        # A broad v2 period query also includes legacy rows. Keep the first
        # (higher-priority) occurrence of each Memory ID so the compatibility
        # query below cannot duplicate citations or consume result slots.
        summary_hits: >-
          ${ reduce ($thread_group_summary_hits + $period_summary_hits + $legacy_period_summary_hits)[] as $hit
            ([]; if any(.[]; .memory.id.value == $hit.memory.id.value)
                 then . else . + [$hit] end) }

  # Step 3: Raw-message layer. owner=user_id=1 (the human user; Lookback
  # currently runs as a single local user). Do not add a thread_filter here:
  # it duplicates this memory-level owner/kind scope but first expands every
  # matching thread into memory IDs, exceeding the server's bounded FTS
  # candidate set for large histories.
  - searchRaw:
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.MemoryVectorService/HybridSearch"
            json_body: >-
              ${ {
                query_vectors: [ { values: $query_vector } ],
                query_text: $workflow.input.query,
                options: {
                  limit: ($workflow.input.limit_per_layer // 5),
                  filter: {
                    user_id: "1",
                    memory_kinds: ["MEMORY_KIND_RAW"]
                  }
                }
              } | tojson }
            as_json: true
      export:
        as:
          raw_hits: ${ (.jsonBody // "[]") | fromjson }

  # Step 4: Project all layers into the compact { source_kind,
   # memory_id, source_thread_id, group_id, period_key, scope_key, snippet, score }
  # shape the chat command surfaces in `chat://step` Source events
  # source_kind is derived from `externalId` — the
  # summaries pipeline (thread-group / daily / weekly / monthly)
  # always sets it on the memory it writes. Field names use
  # protobuf JSON's lowerCamelCase because the GRPC runner emits the
  # response via `prost`'s JSON serializer (matches `data.updatedAt`
  # access in thread-summary-single.yaml).
  - projectHits:
      set:
        sources: >-
           ${ ([ $summary_hits[]
                 | . as $h
                 | ($h.memory.data.externalId // "") as $ext
                 | {
                     source_kind: (
                       if   ($ext | startswith("thread-group-summary:")) then "thread_group_summary"
                       elif ($ext | startswith("daily:"))   then "period_summary"
                      elif ($ext | startswith("weekly:"))  then "period_summary"
                      elif ($ext | startswith("monthly:")) then "period_summary"
                       else null
                      end
                    ),
                     memory_id: $h.memory.id.value,
                     group_id: (
                       if ($ext | startswith("thread-group-summary:"))
                       then ($ext | sub("^thread-group-summary:"; ""))
                       else null
                       end
                     ),
                    source_thread_id: (
                       null
                    ),
                    period_key: (
                      if ($ext | test("^(daily|weekly|monthly):v2:"))
                      then ($ext | capture("^(?<k>daily|weekly|monthly):v2:[^:]+:(?<p>[^:]+):") | .p)
                      elif ($ext | test("^(daily|weekly|monthly):1:"))
                      then ($ext | capture("^(?<k>daily|weekly|monthly):1:(?<p>[^:]+):") | .p)
                      else null
                      end
                    ),
                    scope_key: (
                      ($ext | capture(":(?<s>[^:]+)$") | .s) // null
                    ),
                    snippet: ($h.memory.data.content // "" | .[0:300]),
                    score: $h.score
                  }
               ] | map(select(.source_kind != null))
              + [ $raw_hits[]
                  | {
                      source_kind: "raw_memory",
                      memory_id: .memory.id.value,
                      source_thread_id: ((.threadId // {}).value // null),
                      period_key: null,
                      scope_key: null,
                      snippet: (.memory.data.content // "" | .[0:300]),
                      score: .score
                    }
                ])
           }
      export:
        as:
          # Quoted because the jq expression contains a flow-style `{...}`
          # whose inner `sources:` would otherwise be parsed as a nested
          # YAML mapping ("mapping values are not allowed here").
          result: "${ { sources: $sources } }"
