document:
  dsl: "1.0.0-jobworkerp"
  namespace: memories
  name: thread-summary-batch
  version: "1.0.0"

input:
  schema:
    document:
      type: object
      required: [user_id, memories_grpc_host, memories_grpc_port]
      properties:
        user_id: { type: integer }
        memories_grpc_host: { type: string, default: "localhost" }
        memories_grpc_port: { type: integer, default: 9100 }
        memories_grpc_tls: { type: boolean, default: false }
        thread_ids:
          type: array
          items: { type: string }
          description: When specified, only these threads are summarized (all threads when omitted).
        target_thread_ids:
          type: array
          items: { type: string, pattern: "^[1-9][0-9]*$" }
          description: >-
            Authoritative import target set. Presence takes precedence over
            thread_ids; an explicitly empty array targets zero threads.
        labels_filter:
          type: array
          items: { type: string }
          description: When specified, only threads with these labels are targeted.
        labels_filter_match_mode:
          type: string
          enum: ["LABEL_ALL", "LABEL_ANY"]
          default: "LABEL_ALL"
          description: Match mode for labels_filter. Defaults to legacy LABEL_ALL.
        last_message_within_hours:
          type: integer
          minimum: 1
          description: >-
            When specified, only threads whose `last_message_at` is within the
            past N hours **measured from this workflow's execution time**
            are targeted (server-side `last_message_after` filter, strict `>`).
            Omit to process all threads as before. `last_message_after_ms`
            takes precedence when both are set, because relative windows
            drift with dispatch latency.
        last_message_after_ms:
          type: integer
          minimum: 0
          description: >-
            When specified, an absolute lower bound (epoch ms) for
            `last_message_at`. Takes precedence over `last_message_within_hours`.
            Use this when the caller already knows the absolute conversation
            boundary so dispatch latency cannot shift a relative window.
        last_message_before_ms:
          type: integer
          minimum: 0
          description: >-
            When specified, an absolute upper bound (epoch ms,
            inclusive `<=`) for `last_message_at`. Omit for no upper bound.
            Pairs with `last_message_after_ms` so a range-mode generate run
            (from/to date picker) only touches threads inside the window.
        thread_created_after_ms:
          type: integer
          minimum: 0
          description: Import candidate lower bound (epoch ms, strict `>`).
        thread_created_before_ms:
          type: integer
          minimum: 0
          description: Import candidate upper bound (epoch ms, inclusive `<=`).
        output_language:
          type: string
          enum: ["ja", "en"]
          default: "ja"
          description: >-
            Output language for generated free-text. Selects the
            language-specific single worker
            (`memories-thread-summary-single-<lang>`) per fan-out.
        llm_worker_name:
          type: string
          default: "memories-llm"
          description: >-
            Named worker for LLM completion, forwarded to each single
            invocation. Defaults to `memories-llm`.
        min_message_count: { type: integer, default: 4 }
        max_context_chars: { type: integer, default: 200000 }
        # LLM model is configured on the named worker referenced by
        # `llm_worker_name` (see workers/llm-workers.yaml); no per-batch
        # model input needed.
        memory_thread_label_prefix: { type: string, default: "summary" }
        force_resummarize: { type: boolean, default: false }

timeout:
  after:
    hours: 24

do:
  # Step 0c: Resolve the effective `last_message_after` lower bound (epoch ms).
  # `last_message_after_ms` (absolute) wins when supplied; otherwise fall back
  # to deriving from `last_message_within_hours` (relative to workflow start).
  # The relative path is kept for backward compatibility but it can drift
  # if dispatch is delayed — callers that know the exact boundary should
  # pass `last_message_after_ms` directly. `now` returns seconds; the gRPC
  # filter expects milliseconds. Null result drops the field from the
  # request body so the server treats it as "no lower bound".
  - resolveLastMessageAfter:
      set:
        last_message_after_ms: >-
          ${ if $workflow.input.last_message_after_ms != null
             then $workflow.input.last_message_after_ms
             elif $workflow.input.last_message_within_hours == null
             then null
             else ((now - ($workflow.input.last_message_within_hours * 3600))
                   * 1000 | floor)
             end }

  # Step 0d: Resolve the optional `last_message_before` upper bound. Absolute
  # epoch ms only (the relative `last_message_within_hours` path has no upper
  # counterpart). Null drops the field so the server treats it as "no
  # upper bound".
  - resolveLastMessageBefore:
      set:
        last_message_before_ms: "${ $workflow.input.last_message_before_ms }"

  - initThreadCandidates:
      set:
        all_threads: "${ [] }"

  # Step 1a: Fetch threads by labels (when labels_filter is specified)
  - fetchByLabels:
      if: >-
        ${ (($workflow.input | has("target_thread_ids")) | not
             or ($workflow.input.target_thread_ids | length) > 0)
           and (($workflow.input.labels_filter // []) | length > 0) }
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.ThreadService/FindThreadListByLabels"
            json_body: >-
              ${ ({
                   labels: $workflow.input.labels_filter,
                   match_mode: ($workflow.input.labels_filter_match_mode // "LABEL_ALL"),
                   user_id: $workflow.input.user_id,
                   memory_kinds: ["MEMORY_KIND_RAW"],
                   last_message_after: $last_message_after_ms,
                   last_message_before: $last_message_before_ms,
                   thread_created_after: $workflow.input.thread_created_after_ms,
                   thread_created_before: $workflow.input.thread_created_before_ms
                 }
                 | if $last_message_after_ms == null then del(.last_message_after) else . end
                 | if $last_message_before_ms == null then del(.last_message_before) else . end
                 | if $workflow.input.thread_created_after_ms == null then del(.thread_created_after) else . end
                 | if $workflow.input.thread_created_before_ms == null then del(.thread_created_before) else . end
                 | tojson) }
            as_json: true
      export:
        as:
          all_threads: ${ .jsonBody | fromjson }

  # Step 1b: Fetch all threads by user (when no labels_filter)
  - fetchByUser:
      if: >-
        ${ (($workflow.input | has("target_thread_ids")) | not
             or ($workflow.input.target_thread_ids | length) > 0)
           and (($workflow.input.labels_filter // []) | length == 0) }
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.ThreadService/FindThreadListByUserId"
            json_body: >-
              ${ ({
                   user_id: { value: $workflow.input.user_id },
                   memory_kinds: ["MEMORY_KIND_RAW"],
                   last_message_after: $last_message_after_ms,
                   last_message_before: $last_message_before_ms,
                   thread_created_after: $workflow.input.thread_created_after_ms,
                   thread_created_before: $workflow.input.thread_created_before_ms
                 }
                 | if $last_message_after_ms == null then del(.last_message_after) else . end
                 | if $last_message_before_ms == null then del(.last_message_before) else . end
                 | if $workflow.input.thread_created_after_ms == null then del(.thread_created_after) else . end
                 | if $workflow.input.thread_created_before_ms == null then del(.thread_created_before) else . end
                 | tojson) }
            as_json: true
      export:
        as:
          all_threads: ${ .jsonBody | fromjson }

  # Step 2: Filter by thread_ids if specified.
  - filterThreads:
      set:
        candidate_threads: >-
          ${ if ($workflow.input | has("target_thread_ids"))
             then $all_threads | map(select(
               .id.value as $tid | $workflow.input.target_thread_ids | any(. == ($tid | tostring))
             ))
             elif ($workflow.input.thread_ids // []) | length > 0
             then $all_threads | map(select(
               .id.value as $tid | $workflow.input.thread_ids | any(. == $tid)
             ))
             else $all_threads
             end }

  # Step 2a: Load existing per-thread summaries once. Without this bulk
  # preflight, every up-to-date RAW thread still dispatches a child workflow
  # only to discover that it should skip. Large backfills can spend hours on
  # those serial checks and never reach the dependent daily stage.
  - initExistingSummaries:
      set:
        existing_summary_entries: "${ [] }"
        existing_summary_threads: "${ [] }"

  - fetchExistingSummaries:
      if: "${ $workflow.input.force_resummarize | not }"
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.MemoryService/FindListByCondition"
            json_body: >-
              ${ {
                user_id: { value: $workflow.input.user_id },
                roles: ["ROLE_ASSISTANT"],
                content_types: ["TEXT"],
                memory_kinds: ["MEMORY_KIND_THREAD_SUMMARY"],
                external_id_prefix: "summary:"
              } | tojson }
            as_json: true
      export:
        as:
          existing_summary_entries: ${ .jsonBody | fromjson }

  - fetchExistingSummaryThreads:
      if: "${ $workflow.input.force_resummarize | not }"
      run:
        function:
          runnerName: GRPC
          using: streaming
          settings:
            host: "${$workflow.input.memories_grpc_host}"
            port: ${$workflow.input.memories_grpc_port}
            tls: ${$workflow.input.memories_grpc_tls}
            useReflection: true
          arguments:
            method: "/llm_memory.service.ThreadService/FindThreadListByUserId"
            json_body: >-
              ${ {
                user_id: { value: $workflow.input.user_id },
                memory_kinds: ["MEMORY_KIND_THREAD_SUMMARY"]
              } | tojson }
            as_json: true
      export:
        as:
          existing_summary_threads: ${ .jsonBody | fromjson }

  - indexExistingSummaries:
      set:
        existing_summary_by_external_id: >-
          ${ reduce $existing_summary_entries[] as $entry
             ({};
              .[$entry.memory.data.externalId] = {
                memory: $entry.memory,
                thread_id: ($entry.threadId.value | tostring)
              }) }
        existing_summary_thread_by_id: >-
          ${ reduce $existing_summary_threads[] as $thread
             ({}; .[$thread.id.value | tostring] = $thread) }

  - selectThreadsNeedingSummary:
      set:
        target_threads: >-
          ${ if $workflow.input.force_resummarize
             then $candidate_threads
             else
               $candidate_threads
               | map(
                   . as $thread
                   | ($existing_summary_by_external_id[
                        "summary:" + ($thread.id.value | tostring)
                     ] // null) as $existing_summary
                   | (($thread.data.labels
                       // ["thread_" + ($thread.id.value | tostring)])
                      + [$workflow.input.memory_thread_label_prefix]
                      | unique) as $required_labels
                   | (if $existing_summary == null
                      then null
                      else ($existing_summary_thread_by_id[
                              $existing_summary.thread_id
                            ] // null)
                      end) as $existing_summary_thread
                   | select(
                       ($thread.data.description // "") == ""
                       or $existing_summary == null
                       or $existing_summary_thread == null
                       or (($required_labels
                            - ($existing_summary_thread.data.labels // []))
                           | length) > 0
                       or (
                         (($thread.data.lastMessageAt // "0") | tostring)
                           as $last_message_at
                         | (($existing_summary.memory.data.updatedAt // "0")
                            | tostring) as $summary_updated_at
                         | (($last_message_at | length)
                            > ($summary_updated_at | length))
                           or ((($last_message_at | length)
                               == ($summary_updated_at | length))
                              and $last_message_at > $summary_updated_at)
                       )
                     )
                 )
             end }

  - collectPreSkippedThreads:
      set:
        pre_skipped_threads: >-
          ${ ($candidate_threads | map(.id.value | tostring))
             - ($target_threads | map(.id.value | tostring)) }

  # Step 2.5: Initialize per-thread outcome accumulators. Lets the
  # pipeline parent distinguish "every thread failed" (fatal) from
  # "some succeeded" / "nothing to do" by reading succeeded_count /
  # failed_count, mirroring the period batches' output contract.
  - initOutcomeAccumulators:
      set:
        generated_threads: "${ [] }"
        skipped_threads: "${ $pre_skipped_threads // [] }"
        failed_threads: "${ [] }"
        last_error: "${ null }"

  # Step 3: Invoke the language-specific single-thread summary worker for
  # each thread. The `memories-thread-summary-single-<lang>` workers are
  # pre-registered by `memories-import upsert-generation-workers` with the
  # prompt context baked in, so the batch only forwards `output_language`.
  - summarizeEach:
      timeout:
        after:
          hours: 24
      for:
        each: thread
        # `at` exposes the 0-based loop index so each iteration can publish a
        # (processed/total) progress signal the Tauri toast renders.
        at: thread_index
        in: "${ $target_threads }"
      onError: continue
      do:
        # Emitting progress as the first sub-step makes the streamed
        # WorkflowResult for this iteration carry `progress_processed` /
        # `progress_total` in its output context, which the importer's chunk
        # summarizer surfaces as `(N/M)`.
        - reportProgress:
            set:
              progress_processed: "${ $thread_index + 1 }"
              progress_total: "${ $target_threads | length }"
        - invokeSingleWithRetry:
            try:
              - invokeSingle:
                  timeout:
                    after:
                      minutes: 120
                  run:
                    function:
                      # Resolve the language-specific single worker by name.
                      # Its registered channel (llm_workflow, concurrency=1)
                      # keeps the LLM-containing single workflows off the
                      # `llm` slot the inner LLM job needs (no deadlock).
                      workerName: '${ "memories-thread-summary-single-" + $workflow.input.output_language }'
                      arguments:
                        input: >-
                          ${ {
                            user_id: $workflow.input.user_id,
                            thread_id: ($thread.id.value | tostring),
                            memories_grpc_host: $workflow.input.memories_grpc_host,
                            memories_grpc_port: $workflow.input.memories_grpc_port,
                            memories_grpc_tls: $workflow.input.memories_grpc_tls,
                            llm_worker_name: $workflow.input.llm_worker_name,
                            output_language: $workflow.input.output_language,
                            min_message_count: $workflow.input.min_message_count,
                            max_context_chars: $workflow.input.max_context_chars,
                            memory_thread_label_prefix: $workflow.input.memory_thread_label_prefix,
                            force_resummarize: $workflow.input.force_resummarize,
                          } | tojson }
                  export:
                    as:
                      single_result: "${ .output | fromjson }"
              - rejectLogicalFailure:
                  if: >-
                    ${ (($single_result.completed // false)
                        or ($single_result.skipped // false)) | not }
                  raise:
                    error:
                      type: "https://memories.local/errors/thread-summary/incomplete"
                      status: 500
                      title: "thread summary returned neither completed nor skipped"
              - recordGenerated:
                  if: >-
                    ${ ($single_result.completed // false)
                       and (($single_result.skipped // false) | not) }
                  set:
                    generated_threads: >-
                      ${ $generated_threads + [($thread.id.value | tostring)] }
              - recordSkipped:
                  if: "${ $single_result.skipped // false }"
                  set:
                    skipped_threads: >-
                      ${ $skipped_threads + [($thread.id.value | tostring)] }
            catch:
              as: error
              do:
                - logError:
                    set:
                      failed_threads: >-
                        ${ $failed_threads + [($thread.id.value | tostring)] }
                      last_error: "${ $error }"

output:
  as:
    # `completed` reflects "no thread failed". The pipeline parent reads
    # processed_threads / succeeded_count / failed_count to decide
    # whether to treat the stage as fatal (all failed) vs partial vs skip.
    completed: ${ ($failed_threads | length) == 0 }
    processed_threads: >-
      ${ ($generated_threads | length)
         + ($skipped_threads | length)
         + ($failed_threads | length) }
    generated_count: ${ $generated_threads | length }
    skipped_count: ${ $skipped_threads | length }
    succeeded_count: >-
      ${ ($generated_threads | length) + ($skipped_threads | length) }
    failed_count: ${ $failed_threads | length }
    generated_threads: ${ $generated_threads }
    skipped_threads: ${ $skipped_threads }
    failed_threads: ${ $failed_threads }
    last_error: ${ $last_error }
