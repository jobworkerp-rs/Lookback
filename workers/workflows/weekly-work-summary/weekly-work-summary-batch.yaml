document:
  dsl: "1.0.0-jobworkerp"
  namespace: memories
  name: weekly-work-summary-batch
  version: "1.0.0"

# Generates weekly-work-summary-single for a week range. Use this for
# back-fills or manual re-runs over multiple weeks. Cron-style weekly
# execution should call weekly-work-summary-single directly with no
# `target_week` (defaults to "last completed week").

input:
  schema:
    document:
      type: object
      properties:
        user_id: { type: integer }
        memories_grpc_host: { type: string, default: "localhost" }
        memories_grpc_port: { type: integer, default: 9100 }
        memories_grpc_tls: { type: boolean, default: false }
        llm_worker_name:
          type: string
          default: "memories-llm"
          description: >-
            Named worker for LLM completion, forwarded to each weekly
            single invocation. Defaults to `memories-llm`.
        output_language:
          type: string
          enum: ["ja", "en"]
          default: "ja"
          description: >-
            Output language for generated free-text. Selects the
            language-specific single worker
            (`memories-weekly-work-summary-single-<lang>`) per fan-out.
        start_week:
          type: string
          default: ""
          description: >-
            ISO 8601 week token "YYYY-Www" or empty. Empty = use
            last_n_weeks (or fall back to "last completed week only").
            When non-empty, end_week must also be set; (start, end)
            wins over last_n_weeks.
        end_week:
          type: string
          default: ""
          description: Inclusive end week ("YYYY-Www") or empty.
        target_weeks:
          type: array
          items: { type: string }
          default: []
          description: Explicit YYYY-Www periods. When non-empty, this exact sorted set takes precedence over range and last-N modes.
        last_n_weeks:
          type: integer
          default: 0
          description: >-
            Last N weeks ending the previous fully-completed week (in
            tz). 0 = unused (falls back to start/end or "last week
            only").
        timezone_offset_hours: { type: integer, minimum: 0, maximum: 23, default: 9 }
        daily_label: { type: string, default: "daily_summary" }
        weekly_label: { type: string, default: "weekly_summary" }
        extra_labels_filter:
          type: array
          items: { type: string }
          default: []
        extra_labels_match_mode:
          type: string
          enum: ["LABEL_ALL", "LABEL_ANY"]
          default: "LABEL_ALL"
        min_thread_count: { type: integer, default: 1 }
        max_context_chars: { type: integer, default: 200000 }
        summary_output_guidance: { type: object, default: {weekly: {item_chars: 500, total_chars: 30000}, max_purpose_groups: {weekly: 20}, max_source_memory_ids: 10} }
        llm_context_window_tokens: { type: integer, minimum: 1024, default: 131072 }
        llm_expected_model: { type: string, default: "" }
        summary_max_completion_tokens: { type: integer, minimum: 1, default: 32768 }
        summary_input_byte_budget: { type: integer, minimum: 0, default: 200000 }
        force_resummarize: { type: boolean, default: false }
        stop_on_error: { type: boolean, default: false }
        # SHA-256 of canonical {"labels":[],"match_mode":"LABEL_ALL","version":1}.
        source_scope_digest: { type: string, default: "999b928053067e9fc9369c99aa2ef91b5d096fabee5c34e90097fa937820524a" }
        generation_id: { type: string, default: "" }
        generation_started_at: { type: string, default: "" }

do:
  # Step 1: Resolve the week list. Modes (in priority order):
  #   range:       (start_week, end_week) inclusive
  #   last-N:      last_n_weeks weeks ending the previous completed week
  #   fallback:    [last_week] only
  # See weekly-work-summary-single.yaml resolveTargetWeek for the TZ
  # handling rationale (jq strftime is UTC-only). Only the "last week
  # Monday" anchor is tz-sensitive; the range/last-N stepping runs in
  # UTC-as-if seconds (tz-invariant).
  #
  # `last_week_monday_epoch` is an anchor fed to the UTC-as-if
  # `strftime("%G-W%V")`. Offset path shifts `now` by the fixed offset;
  # TZ path anchors today's local date (via strflocaltime) at 12:00
  # UTC-as-if and does the weekday/back-off arithmetic there. It must not
  # subtract UTC seconds from `now`: near a DST transition that slips an
  # hour and can land on the previous ISO week. Noon anchors keep the
  # stepped weeks aligned so downstream `strftime("%G-W%V")` round-trips.
  - resolveLastWeekMonday:
      set:
        last_week_monday_epoch: >-
          ${ if (env.TZ // "") != ""
             then ((now | strflocaltime("%Y-%m-%d")) as $today
                   | ($today + "T12:00:00Z" | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) as $noon
                   | ($noon | strftime("%u") | tonumber) as $wday
                   | ($noon - (($wday - 1) * 86400) - 7 * 86400))
             else ((now + ($workflow.input.timezone_offset_hours * 3600)) as $local
                   | ($local | strftime("%u") | tonumber) as $wday
                   | ($local - (($wday - 1) * 86400) - 7 * 86400))
             end }

  - resolveWeekRange:
      set:
        week_list: >-
          ${ if ($workflow.input.target_weeks // [] | length) > 0
             then ($workflow.input.target_weeks | unique | sort)
             elif $workflow.input.start_week != ""
                and $workflow.input.end_week != ""
             then
               # Range mode. Convert both ends to Monday-epochs, step by week.
               # Requires jaq's strptime("%G-W%V-%u").
               ((($workflow.input.start_week + "-1")
                 | strptime("%G-W%V-%u") | mktime) as $s
                | (($workflow.input.end_week + "-1")
                   | strptime("%G-W%V-%u") | mktime) as $e
                | [range($s; $e + 1; 7 * 86400)]
                | map(strftime("%G-W%V")))
             elif $workflow.input.last_n_weeks > 0
             then
               ([range(0; $workflow.input.last_n_weeks)]
                | map(($last_week_monday_epoch - (. * 7 * 86400))
                      | strftime("%G-W%V"))
                | reverse)
             else
               [$last_week_monday_epoch | strftime("%G-W%V")]
             end }

  # Step 1.5: Initialize accumulators so the for-loop below can append
  # to them and the output block can reference them even when zero
  # iterations ran.
  - initOutcomeAccumulators:
      set:
        generated_weeks: "${ [] }"
        skipped_weeks: "${ [] }"
        failed_weeks: "${ [] }"
        failed_path_buckets: "${ [] }"
        last_error: "${ null }"

  # Step 2: For each week, dispatch weekly-work-summary-single. Failures
  # in one week must not abort the rest of the range — a missing week
  # is less bad than dropping the weeks after it. Per-week outcome is
  # accumulated so the caller can re-run only the failed weeks.
  - summarizeEachWeek:
      for:
        each: target_week
        at: week_index
        in: "${ $week_list }"
      onError: continue
      do:
        - reportProgress:
            set:
              progress_processed: "${ $week_index + 1 }"
              progress_total: "${ $week_list | length }"
        - abortBeforeNextWeekAfterPathFailure:
            if: "${ $workflow.input.stop_on_error and ($failed_path_buckets | length) > 0 }"
            raise:
              error:
                type: "https://memories.local/errors/weekly-work-summary/path"
                status: 500
                title: "weekly path summary failed"
                detail: "stop_on_error is enabled; no later period was started"
        - initPathOutcome:
            set:
              path_failed_for_week: "${ false }"
              planned_weekly_path_bucket_digests: "${ [] }"
        - discoverPathPlan:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            try:
              - runPathPlan:
                  run:
                    function:
                      workerName: '${ "memories-weekly-work-summary-single-" + $workflow.input.output_language }'
                      arguments:
                        input: >-
                          ${ {user_id:$workflow.input.user_id,target_week:$target_week,
                              timezone_offset_hours:$workflow.input.timezone_offset_hours,
                              memories_grpc_host:$workflow.input.memories_grpc_host,
                              memories_grpc_port:$workflow.input.memories_grpc_port,
                              memories_grpc_tls:$workflow.input.memories_grpc_tls,
                              daily_label:$workflow.input.daily_label,weekly_label:$workflow.input.weekly_label,
                              source_memory_kind:"MEMORY_KIND_DAILY_SUMMARY",
                              source_thread_labels_override:[$workflow.input.daily_label,"summary_scope:path","source_scope:" + $workflow.input.source_scope_digest],
                              source_thread_match_mode:"LABEL_ALL",plan_only:true} | tojson }
                  export:
                    as:
                      weekly_path_plan: "${ .output | fromjson }"
            catch:
              as: error
              do:
                - recordPathPlanFailure:
                    set:
                      failed_weeks: "${ $failed_weeks + [$target_week] }"
                      last_error: "${ $error }"
                - abortImmediatelyAfterPathPlanFailure:
                    if: "${ $workflow.input.stop_on_error }"
                    raise:
                      error:
                        type: "https://memories.local/errors/weekly-work-summary/path-plan"
                        status: 500
                        title: "weekly path plan failed before summary generation"
                        detail: "stop_on_error is enabled; remaining paths were not started"

        - derivePlannedPathBucketDigests:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            for:
              each: planned_path_bucket
              in: "${ $weekly_path_plan.path_buckets // [] }"
            do:
              - derivePlannedPathBucketDigest:
                  run:
                    function:
                      runnerName: COMMAND
                      settings: {}
                      arguments:
                        command: "/bin/sh"
                        args: ["-c", "if command -v shasum >/dev/null 2>&1; then shasum -a 256; else sha256sum; fi | awk '{print $1}'"]
                        stdin: >-
                          ${ if $planned_path_bucket.path_bucket_kind == "label"
                             then ({kind: "label", label: $planned_path_bucket.path_label, version: 1} | tojson)
                             else ({kind: $planned_path_bucket.path_bucket_kind, version: 1} | tojson)
                             end }
                        treat_nonzero_as_error: true
                  export:
                    as:
                      planned_path_bucket_digest: "${ .stdout | split(\" \")[0] }"
              - recordPlannedPathBucketDigest:
                  set:
                    planned_weekly_path_bucket_digests: "${ $planned_weekly_path_bucket_digests + [$planned_path_bucket_digest] }"

        # Remove v2 path memories which no longer have a bucket in the
        # authoritative daily-path plan. Keep their empty threads and all
        # legacy rows intact; neither is safe to delete automatically.
        - findExistingPathThreads:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            run:
              function:
                runnerName: GRPC
                using: streaming
                settings:
                  host: "${$workflow.input.memories_grpc_host}"
                  port: ${$workflow.input.memories_grpc_port}
                  tls: ${$workflow.input.memories_grpc_tls}
                  useReflection: true
                arguments:
                  method: "/llm_memory.service.ThreadService/FindThreadListByLabels"
                  json_body: >-
                    ${ {labels: [$workflow.input.weekly_label, "iso_week:" + $target_week,
                                  "summary_scope:path", "source_scope:" + $workflow.input.source_scope_digest],
                        match_mode: "LABEL_ALL", user_id: $workflow.input.user_id,
                        memory_kinds: ["MEMORY_KIND_WEEKLY_SUMMARY"]} | tojson }
                  as_json: true
            export:
              as:
                existing_weekly_path_threads: "${ .jsonBody | fromjson }"
        - identifyStalePathThreads:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            set:
              stale_weekly_path_threads: >-
                ${ ($weekly_path_plan.path_buckets // []
                    | map(if .path_bucket_kind == "label" then "label:" + .path_label
                          else .path_bucket_kind + ":" end)) as $planned
                   | $existing_weekly_path_threads
                   | map(select((.data.labels // []) as $labels
                                | ($labels | map(select(startswith("path:"))) | unique) as $paths
                                | (if ($labels | index("summary_path:ambiguous")) != null then "ambiguous:"
                                   elif ($labels | index("summary_path:unassigned")) != null then "unassigned:"
                                   elif ($paths | length) == 1 then "label:" + $paths[0]
                                   else "ambiguous:" end) as $bucket_key
                                | ($planned | index($bucket_key)) == null)) }
        - cleanupStalePathMemories:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            for:
              each: stale_thread
              in: "${ $stale_weekly_path_threads }"
            onError: continue
            do:
              - findStaleMemories:
                  run:
                    function:
                      runnerName: GRPC
                      using: streaming
                      settings:
                        host: "${$workflow.input.memories_grpc_host}"
                        port: ${$workflow.input.memories_grpc_port}
                        tls: ${$workflow.input.memories_grpc_tls}
                        useReflection: true
                      arguments:
                        method: "/llm_memory.service.ThreadService/FindMemoriesByThreadId"
                        json_body: >-
                          ${ {thread_id: {value: $stale_thread.id.value},
                              roles: ["ROLE_ASSISTANT"], content_types: ["TEXT"]} | tojson }
                        as_json: true
                  export:
                    as:
                      stale_weekly_path_memories: >-
                        ${ (.jsonBody // "[]") | fromjson
                           | map(select((.data.externalId // "") | startswith("weekly:v2:"))) }
              - deleteStaleMemories:
                  for:
                    each: stale_memory
                    in: "${ $stale_weekly_path_memories }"
                  do:
                    - deleteStaleMemory:
                        run:
                          function:
                            runnerName: GRPC
                            using: unary
                            settings:
                              host: "${$workflow.input.memories_grpc_host}"
                              port: ${$workflow.input.memories_grpc_port}
                              tls: ${$workflow.input.memories_grpc_tls}
                              useReflection: true
                            arguments:
                              method: "/llm_memory.service.MemoryService/Delete"
                              json_body: "${ $stale_memory.id | tojson }"
                              as_json: true

        - summarizeEachPath:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            for:
              each: path_bucket
              in: "${ $weekly_path_plan.path_buckets // [] }"
            do:
              - derivePathBucketDigest:
                  run:
                    function:
                      runnerName: COMMAND
                      settings: {}
                      arguments:
                        command: "/bin/sh"
                        args: ["-c", "if command -v shasum >/dev/null 2>&1; then shasum -a 256; else sha256sum; fi | awk '{print $1}'"]
                        stdin: >-
                          ${ if $path_bucket.path_bucket_kind == "label"
                             then ({kind: "label", label: $path_bucket.path_label, version: 1} | tojson)
                             else ({kind: $path_bucket.path_bucket_kind, version: 1} | tojson)
                             end }
                        treat_nonzero_as_error: true
                  export:
                    as:
                      path_bucket_digest: "${ .stdout | split(\" \")[0] }"
              - invokePathSingle:
                  try:
                    - runPathSingle:
                        run:
                          function:
                            workerName: '${ "memories-weekly-work-summary-single-" + $workflow.input.output_language }'
                            arguments:
                              input: >-
                                ${ {user_id:$workflow.input.user_id,target_week:$target_week,
                                  timezone_offset_hours:$workflow.input.timezone_offset_hours,
                                  memories_grpc_host:$workflow.input.memories_grpc_host,
                                  memories_grpc_port:$workflow.input.memories_grpc_port,
                                  memories_grpc_tls:$workflow.input.memories_grpc_tls,
                                  llm_worker_name:$workflow.input.llm_worker_name,output_language:$workflow.input.output_language,
                                  daily_label:$workflow.input.daily_label,weekly_label:$workflow.input.weekly_label,
                                  v2_source_scope_digest:$workflow.input.source_scope_digest,v2_rollup_scope:"path",
                                  v2_path_bucket_digest:$path_bucket_digest,
                                  v2_path_bucket_kind:$path_bucket.path_bucket_kind,v2_path_label:$path_bucket.path_label,
                                  generation_id:$workflow.input.generation_id,generation_started_at:$workflow.input.generation_started_at,
                                  summary_output_guidance:$workflow.input.summary_output_guidance,
                                  llm_context_window_tokens:$workflow.input.llm_context_window_tokens,llm_expected_model:$workflow.input.llm_expected_model,
                                  summary_max_completion_tokens:$workflow.input.summary_max_completion_tokens,
                                  summary_input_byte_budget:$workflow.input.summary_input_byte_budget,
                                  planned_source_memory_ids:$path_bucket.source_memory_ids,
                                  source_memory_kind:"MEMORY_KIND_DAILY_SUMMARY",
                                  source_thread_labels_override:[$workflow.input.daily_label,"summary_scope:path","source_scope:" + $workflow.input.source_scope_digest],
                                  source_thread_match_mode:"LABEL_ALL"} | tojson }
                        export:
                          as:
                            path_single_result: "${ .output | fromjson }"
                    - rejectEmptyPlannedPathResult:
                        if: >-
                          ${ ($path_single_result.skipped // false)
                             and (($path_single_result.source_memory_count // 0) == 0) }
                        raise:
                          error:
                            type: "https://memories.local/errors/weekly-work-summary/path-source-disappeared"
                            status: 409
                            title: "weekly path source memories disappeared after planning"
                            detail: "the planned Path bucket no longer has source memories"
                  catch:
                    as: error
                    do:
                      - recordPathFailure:
                          set:
                            path_failed_for_week: "${ true }"
                            failed_path_buckets: >-
                              ${ $failed_path_buckets + [{period_key:$target_week,
                                  path_bucket_digest:$path_bucket_digest,
                                  path_bucket_kind:$path_bucket.path_bucket_kind,
                                  path_label:$path_bucket.path_label,error:$error}] }
                      - abortImmediatelyAfterPathFailure:
                          if: "${ $workflow.input.stop_on_error }"
                          raise:
                            error:
                              type: "https://memories.local/errors/weekly-work-summary/path"
                              status: 500
                              title: "weekly path summary failed"
                              detail: "stop_on_error is enabled; remaining paths were not started"

        - abortBeforeOverallOnPathFailure:
            if: "${ $workflow.input.stop_on_error and $path_failed_for_week }"
            raise:
              error:
                type: "https://memories.local/errors/weekly-work-summary/path"
                status: 500
                title: "weekly path summary failed"
                detail: "stop_on_error is enabled; overall generation was not attempted"

        - invokeSingleWithRetry:
            if: "${ (($failed_weeks | index($target_week)) == null) and (($workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0))) | not) }"
            try:
              - invokeSingle:
                  run:
                    function:
                      # Resolve the language-specific single worker by name.
                      # Its registered channel (llm_workflow, concurrency=1)
                      # keeps the LLM-containing single workflows off the
                      # `llm` slot the inner LLM job needs (no deadlock).
                      workerName: '${ "memories-weekly-work-summary-single-" + $workflow.input.output_language }'
                      arguments:
                        input: >-
                          ${ {
                            user_id: $workflow.input.user_id,
                            target_week: $target_week,
                            timezone_offset_hours: $workflow.input.timezone_offset_hours,
                            memories_grpc_host: $workflow.input.memories_grpc_host,
                            memories_grpc_port: $workflow.input.memories_grpc_port,
                            memories_grpc_tls: $workflow.input.memories_grpc_tls,
                            llm_worker_name: $workflow.input.llm_worker_name,
                            output_language: $workflow.input.output_language,
                            daily_label: $workflow.input.daily_label,
                            weekly_label: $workflow.input.weekly_label,
                            extra_labels_filter: $workflow.input.extra_labels_filter,
                            extra_labels_match_mode: ($workflow.input.extra_labels_match_mode // "LABEL_ALL"),
                            min_thread_count: $workflow.input.min_thread_count,
                            max_context_chars: $workflow.input.max_context_chars,
                            summary_output_guidance: $workflow.input.summary_output_guidance,
                            llm_context_window_tokens: $workflow.input.llm_context_window_tokens,
                            llm_expected_model: $workflow.input.llm_expected_model,
                            summary_max_completion_tokens: $workflow.input.summary_max_completion_tokens,
                            summary_input_byte_budget: $workflow.input.summary_input_byte_budget,
                            force_resummarize: $workflow.input.force_resummarize,
                            v2_source_scope_digest: $workflow.input.source_scope_digest,
                            v2_rollup_scope: "overall",
                            source_memory_kind: "MEMORY_KIND_WEEKLY_SUMMARY",
                            source_thread_labels_override: [$workflow.input.weekly_label,
                                                            "iso_week:" + $target_week,
                                                            "summary_scope:path",
                                                            "source_scope:" + $workflow.input.source_scope_digest],
                            source_thread_match_mode: "LABEL_ALL",
                            expected_path_bucket_count: ($weekly_path_plan.path_buckets | length),
                            planned_path_bucket_digests: $planned_weekly_path_bucket_digests,
                            v2_failed_path_buckets: ($failed_path_buckets | map(select(.period_key == $target_week))),
                            generation_id: $workflow.input.generation_id,
                            generation_started_at: $workflow.input.generation_started_at
                          } | tojson }
                  export:
                    as:
                      single_result: "${ .output | fromjson }"
              - rejectLogicalFailure:
                  if: >-
                    ${ (($single_result.completed // false)
                        or ($single_result.skipped // false)) | not }
                  raise:
                    error:
                      type: "https://memories.local/errors/weekly-work-summary/incomplete"
                      status: 500
                      title: "weekly summary returned neither completed nor skipped"
              - recordGenerated:
                  if: >-
                    ${ ($single_result.completed // false)
                       and (($single_result.skipped // false) | not) }
                  set:
                    generated_weeks: "${ $generated_weeks + [$target_week] }"
              - recordSkipped:
                  if: "${ $single_result.skipped // false }"
                  set:
                    skipped_weeks: "${ $skipped_weeks + [$target_week] }"
            catch:
              as: error
              do:
                - recordFailure:
                    set:
                      failed_weeks: "${ $failed_weeks + [$target_week] }"
                      last_error: "${ $error }"

  # An item whose own try timed out is skipped by `onError: continue` without
  # reaching its catch. Count such items as failed so an incomplete run is
  # never reported as completed.
  - collectUnaccountedWeeks:
      set:
        unaccounted_weeks: >-
          ${ ($week_list) - $generated_weeks - $skipped_weeks - $failed_weeks }
  - recordUnaccountedWeeks:
      if: "${ ($unaccounted_weeks | length) > 0 }"
      set:
        failed_weeks: "${ $failed_weeks + $unaccounted_weeks }"
        last_error: >-
          ${ $last_error // ((($unaccounted_weeks | length) | tostring)
             + " item(s) ended without an outcome (timed out or aborted)") }

  - abortBatchOnPathFailure:
      if: "${ $workflow.input.stop_on_error and ((($failed_path_buckets | length) > 0) or (($failed_weeks | length) > 0)) }"
      raise:
        error:
          type: "https://memories.local/errors/weekly-work-summary/path"
          status: 500
          title: "weekly path summary failed"
          detail: "one or more path summaries failed"

output:
  as:
    # `completed` reflects "all attempted weeks succeeded".
    # When false, inspect `failed_weeks` to know what to re-run.
    completed: ${ ($failed_weeks | length) == 0 }
    outcome: >-
      ${ if ($failed_weeks | length) > 0 then "failed"
         elif ($failed_path_buckets | length) > 0 then "completed_with_errors"
         else "succeeded" end }
    processed_weeks: ${ $week_list | length }
    generated_count: ${ $generated_weeks | length }
    skipped_count: ${ $skipped_weeks | length }
    succeeded_count: ${ ($generated_weeks | length) + ($skipped_weeks | length) }
